import java.nio.file.Files
import java.nio.file.StandardCopyOption

configurations { ili2pg }
dependencies {
    ili2pg 'ch.interlis:ili2pg:5.5.2'
    ili2pg 'org.postgresql:postgresql'
}

['config', 'log'].each { model ->
    tasks.register("generate${model.capitalize()}Sql", JavaExec) {
        group = 'development'
        classpath = configurations.ili2pg
        mainClass = 'ch.ehi.ili2pg.PgMain'
        inputs.file('dev/SO_AGI_Datahub_20240403.ili')
        def ddl = layout.buildDirectory.file("schema/${model}.sql").get().asFile
        outputs.file(ddl)
        if (model == 'config') {
            def configConstraints = file('sql/config-constraints.sql')
            inputs.file(configConstraints)
            doLast { ddl.append('\n' + configConstraints.text, 'UTF-8') }
        }
        doFirst { ddl.parentFile.mkdirs() }
        args '--createscript', ddl.absolutePath, '--modeldir', 'dev',
                '--models', "SO_AGI_Datahub_${model.capitalize()}_20240403",
                '--dbschema', "agi_datahub_${model}_v1", '--nameByTopic', '--createFk',
                '--createFkIdx', '--createUnique', '--createImportTabs', '--createMetaInfo'
    }
}

tasks.register('generateSchema') {
    group = 'development'
    dependsOn 'generateConfigSql', 'generateLogSql'
}

tasks.register('generateGdiSetupSql', JavaExec) {
    group = 'development'
    description = 'Generates sql/setup_gdi.sql for a fresh PostgreSQL database.'
    dependsOn 'generateSchema'
    classpath = configurations.runtimeClasspath
    mainClass = 'org.jobrunr.storage.sql.common.DatabaseSqlMigrationFileProvider'
    def jobrunrSchema = 'agi_datahub_jobrunr_v1'
    args 'postgres', jobrunrSchema + '.'

    def schemaDirectory = layout.buildDirectory.dir('schema')
    def grants = layout.projectDirectory.file('sql/grants.sql')
    def setup = layout.projectDirectory.file('sql/setup_gdi.sql')
    doFirst {
        workingDir = Files.createTempDirectory(temporaryDir.toPath(), 'jobrunr-').toFile()
        standardOutput = new ByteArrayOutputStream()
    }
    doLast {
        try {
            // The exporter catches exceptions and reports them on stdout.
            def exportLog = standardOutput.toString('UTF-8')
            def migrations = workingDir.listFiles()
                    .findAll { it.name.endsWith('.sql') }
                    .sort { it.name }
            if (!exportLog.readLines().contains('Successfully created all SQL scripts for postgres!') ||
                    migrations.isEmpty() || migrations.first().name != 'v000__create_migrations_table.sql' ||
                    migrations.any { !it.isFile() || it.length() == 0 || !(it.name ==~ /v[0-9]+__[a-zA-Z0-9_]+\.sql/) }) {
                throw new GradleException("JobRunr SQL export failed:\n${exportLog}")
            }

            def content = new StringBuilder('''\
-- Generated by ./gradlew generateGdiSetupSql. See docs/develop-manual-de.md.
\\set ON_ERROR_STOP on
BEGIN;

''')
            def schemas = schemaDirectory.get().asFile
            ['config', 'log'].each { model ->
                content.append(new File(schemas, "${model}.sql").getText('UTF-8')).append('\n')
            }
            content.append("CREATE SCHEMA ${jobrunrSchema};\n\n")
            migrations.each { migration ->
                content.append("-- ${migration.name}\n")
                content.append(migration.getText('UTF-8')).append('\n')
                content.append("""\
INSERT INTO ${jobrunrSchema}.jobrunr_migrations (id, script, installedon)
VALUES (gen_random_uuid()::text, '${migration.name}',
        to_char(CURRENT_TIMESTAMP AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'));

""")
            }
            content.append(grants.asFile.getText('UTF-8')).append('\nCOMMIT;\n')

            def output = setup.asFile.toPath()
            def candidate = Files.createTempFile(output.parent, '.setup-gdi-', '.sql')
            try {
                Files.writeString(candidate, content)
                Files.move(candidate, output, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE)
            } finally {
                Files.deleteIfExists(candidate)
            }
        } finally {
            workingDir.deleteDir()
        }
    }
}

tasks.register('devInfrastructure', Exec) {
    group = 'development'
    dependsOn 'generateSchema'
    commandLine 'docker', 'compose', '-f', 'dev/docker-compose.yml', 'up', '-d', '--wait'
}
tasks.register('devUp', JavaExec) {
    group = 'development'
    dependsOn 'devInfrastructure'
    classpath = configurations.runtimeClasspath
    mainClass = 'org.jobrunr.storage.sql.common.DatabaseCreator'
    args 'jdbc:postgresql://127.0.0.1:55432/edit', 'postgres', 'secret', 'agi_datahub_jobrunr_v1.'
}
tasks.register('devSeed', Exec) {
    group = 'development'
    dependsOn 'devUp'
    commandLine 'docker', 'compose', '-f', 'dev/docker-compose.yml', 'exec', '-T', 'edit-db',
            'psql', '-v', 'ON_ERROR_STOP=1', '-U', 'postgres', '-d', 'edit'
    doFirst { standardInput = file('dev/seed.sql').newInputStream() }
    doLast { standardInput.close() }
}
tasks.register('devDown', Exec) {
    group = 'development'
    commandLine 'docker', 'compose', '-f', 'dev/docker-compose.yml', 'down'
}
tasks.register('devReset', Exec) {
    group = 'development'
    description = 'Deletes only the local Compose database volume. Run devSeed afterwards.'
    commandLine 'docker', 'compose', '-f', 'dev/docker-compose.yml', 'down', '--volumes'
}
