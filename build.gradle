
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.cayenne.plugins:cayenne-gradle-plugin:4.2.3'
        classpath 'org.postgresql:postgresql:42.6.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'gg.jte.gradle' version '3.2.4'
}

apply plugin: 'org.apache.cayenne'
apply from: "$rootDir/gradle/versioning.gradle"
apply from: "$rootDir/gradle/docker.gradle"
apply from: "$rootDir/gradle/development.gradle"

group = 'ch.so.agi.datahub'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

compileJava {
    mustRunAfter 'cgen'
    options.compilerArgs.addAll(['--release', '21'])
}

bootJar {
   archiveFileName = archiveBaseName.get() + "-" + version + "-exec.jar"
}

repositories {
    mavenCentral()
    maven { url 'https://jars.interlis.ch/' }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.8.2'

    implementation 'ch.interlis:ilivalidator:1.14.3'

    implementation 'org.apache.cayenne:cayenne-server:4.2.3'

    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testImplementation 'org.awaitility:awaitility:4.2.0'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
    integrationTestImplementation 'org.flywaydb:flyway-core:11.14.1'
    integrationTestImplementation 'org.flywaydb:flyway-database-postgresql:11.14.1'
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.setSrcDirs(['src/integrationTest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    e2eTest {
        java.srcDir 'src/e2eTest/java'
        resources.setSrcDirs(['src/e2eTest/resources'])
        compileClasspath += sourceSets.main.output + configurations.e2eTestCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.e2eTestRuntimeClasspath
    }
}

configurations.e2eTestImplementation.extendsFrom configurations.integrationTestImplementation
configurations.e2eTestRuntimeOnly.extendsFrom configurations.integrationTestRuntimeOnly
sourceSets.e2eTest.compileClasspath += sourceSets.integrationTest.output
sourceSets.e2eTest.runtimeClasspath += sourceSets.integrationTest.output
configurations.matching { it.name.toLowerCase().contains('integrationtest') || it.name.toLowerCase().contains('e2etest') }.all {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.flywaydb') useVersion '11.14.1'
        if (requested.group == 'org.testcontainers') useVersion '2.0.5'
    }
}
tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'integrationTest', 'e2eTest' }

tasks.register('e2eTest', Test) {
    description = 'Runs end-to-end tests.'
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    shouldRunAfter test, integrationTest
    dependsOn 'bootJar'
    useJUnitPlatform()
    doFirst {
        systemProperty 'app.testRuntimeClasspath', sourceSets.e2eTest.runtimeClasspath.asPath
        systemProperty 'app.productionJar', tasks.bootJar.archiveFile.get().asFile.absolutePath
    }
}

jte {
    generate()
    binaryStaticContent = true
}

tasks.named('test') {
    useJUnitPlatform()
    include 'ch/so/agi/datahub/**'
}

cayenne.defaultDataMap "$projectDir/src/main/resources/cayenne/datamap.map.xml"

cgen {
    client = false
    mode = 'entity'
    overwrite = true
    //createPKProperties = true
}

cdbimport {
    map "$projectDir/src/main/resources/cayenne/datamap.map.xml"

    cayenneProject "$projectDir/src/main/resources/cayenne/cayenne-project.xml"

    dataSource {
        driver 'org.postgresql.Driver'
        url "jdbc:postgresql://localhost:55432/edit"
        username 'postgres'
        password 'secret'
    }

    dbImport {
        usePrimitives false
        defaultPackage 'ch.so.agi.datahub.cayenne'
            schema {
                name 'agi_datahub_config_v1'
                includeTable 'core_operat'
                includeTable 'core_organisation'
                includeTable 'core_apikey'
                includeTable 'core_theme'
                includeTable 'core_user'
                includeTable 'deliveries_delivery'
            }
            schema {
                name 'agi_datahub_log_v1'
                includeTable 'deliveries_delivery'
                includeTable 'dataset_publication'
                includeTable 'validation_attempt'
                includeTable 'notification'
            }
    }
}
