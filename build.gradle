
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.cayenne.plugins:cayenne-gradle-plugin:5.0-RC1'
        classpath 'org.postgresql:postgresql:42.6.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'gg.jte.gradle' version '3.2.4'
}

apply plugin: 'org.apache.cayenne'
apply from: "$rootDir/gradle/versioning.gradle"
apply from: "$rootDir/gradle/docker.gradle"
apply from: "$rootDir/gradle/development.gradle"

group = 'ch.so.agi.datahub'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

compileJava {
    mustRunAfter 'cgen'
    options.compilerArgs.addAll(['--release', '21'])
}

bootJar {
   archiveFileName = archiveBaseName.get() + "-" + version + "-exec.jar"
}

repositories {
    mavenCentral()
    maven { url 'https://jars.interlis.ch/' }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    e2eTest {
        compileClasspath += sourceSets.main.output + sourceSets.integrationTest.output
        runtimeClasspath += sourceSets.main.output + sourceSets.integrationTest.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    e2eTestImplementation.extendsFrom integrationTestImplementation
    e2eTestRuntimeOnly.extendsFrom integrationTestRuntimeOnly
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.8.2'

    implementation 'ch.interlis:ilivalidator:1.14.3'

    implementation 'org.apache.cayenne:cayenne:5.0-RC1'

    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testImplementation 'org.awaitility:awaitility:4.2.0'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
}

configurations.matching { it.name.toLowerCase().contains('integrationtest') || it.name.toLowerCase().contains('e2etest') }.all {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.testcontainers') useVersion '2.0.5'
    }
}
tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    dependsOn 'generateSchema'
    useJUnitPlatform()
}
tasks.named('check') { dependsOn 'integrationTest', 'e2eTest' }

tasks.register('e2eTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    shouldRunAfter test, integrationTest
    dependsOn 'buildImage', 'generateSchema'
    useJUnitPlatform()
    inputs.file('Dockerfile')
    inputs.file(tasks.bootJar.archiveFile)
    inputs.files('sql/setup_gdi.sql', 'sql/grants.sql',
            layout.buildDirectory.file('schema/config.sql'), layout.buildDirectory.file('schema/log.sql'))
    systemProperty 'app.productionImage', localImage
}

jte {
    generate()
    binaryStaticContent = true
}

tasks.named('test') {
    useJUnitPlatform()
}

cayenne.defaultDataMap "$projectDir/src/main/resources/cayenne/datamap.map.xml"

processResources { mustRunAfter 'cdbimport' }

cgen {
    mustRunAfter 'cdbimport'
    overwrite = true
}

cdbimport {
    map "$projectDir/src/main/resources/cayenne/datamap.map.xml"

    cayenneProject "$projectDir/src/main/resources/cayenne/cayenne-project.xml"

    dataSource {
        driver 'org.postgresql.Driver'
        url providers.gradleProperty("cayenneJdbcUrl").getOrElse("jdbc:postgresql://localhost:55432/edit")
        username 'postgres'
        password 'secret'
    }

    dbImport {
        usePrimitives false
        defaultPackage 'ch.so.agi.datahub.cayenne'
            schema {
                name 'agi_datahub_config_v1'
                includeTable 'core_operat'
                includeTable 'core_organisation'
                includeTable 'core_apikey'
                includeTable 'core_theme'
            }
            schema {
                name 'agi_datahub_log_v1'
                includeTable 'deliveries_delivery'
            }
    }
}
